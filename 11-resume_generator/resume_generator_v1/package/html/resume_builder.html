<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>简历生成器</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/4.7.0/css/font-awesome.min.css">
    <script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.8/dist/chart.umd.min.js"></script>
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        primary: '#165DFF',
                        secondary: '#6B7280',
                        accent: '#3B82F6',
                        success: '#10B981',
                        warning: '#F59E0B',
                        danger: '#EF4444',
                        light: '#F3F4F6',
                        dark: '#1F2937'
                    },
                    fontFamily: {
                        sans: ['Inter', 'system-ui', 'sans-serif'],
                    },
                }
            }
        }
    </script>
    <style type="text/tailwindcss">
        @layer utilities {
            .content-auto {
                content-visibility: auto;
            }
            .scrollbar-thin {
                scrollbar-width: thin;
            }
            .scrollbar-hide::-webkit-scrollbar {
                display: none;
            }
            .transition-height {
                transition: max-height 0.3s ease-out;
            }
            .treeview-row:hover {
                background-color: rgba(22, 93, 255, 0.05);
            }
            .treeview-row-selected {
                background-color: rgba(22, 93, 255, 0.1);
            }
        }
    </style>
</head>
<body class="bg-gray-50 min-h-screen flex flex-col">
    <!-- 顶部导航栏 -->
    <header class="bg-white shadow-sm sticky top-0 z-10">
        <div class="container mx-auto px-4 py-3 flex justify-between items-center">
            <div class="flex items-center space-x-2">
                <i class="fa fa-file-text-o text-primary text-2xl"></i>
                <h1 class="text-xl font-bold text-dark">简历生成器</h1>
            </div>
            <nav class="hidden md:flex space-x-6">
                <button id="menu-file" class="flex items-center space-x-1 text-secondary hover:text-primary transition-colors">
                    <i class="fa fa-file-o"></i>
                    <span>文件</span>
                </button>
                <button id="menu-special-update" class="flex items-center space-x-1 text-secondary hover:text-primary transition-colors">
                    <i class="fa fa-refresh"></i>
                    <span>特殊更新</span>
                </button>
                <button id="menu-bank" class="flex items-center space-x-1 text-secondary hover:text-primary transition-colors">
                    <i class="fa fa-university"></i>
                    <span>银行管理</span>
                </button>
                <button id="menu-validation" class="flex items-center space-x-1 text-secondary hover:text-primary transition-colors">
                    <i class="fa fa-check-square-o"></i>
                    <span>简历校验</span>
                </button>
            </nav>
            <button id="mobile-menu-button" class="md:hidden text-secondary hover:text-primary">
                <i class="fa fa-bars text-xl"></i>
            </button>
        </div>
        <!-- 移动端菜单 -->
        <div id="mobile-menu" class="hidden md:hidden bg-white shadow-md absolute w-full">
            <div class="container mx-auto px-4 py-2 flex flex-col space-y-3">
                <button id="mobile-menu-file" class="flex items-center space-x-2 text-secondary py-2 hover:text-primary transition-colors">
                    <i class="fa fa-file-o w-5 text-center"></i>
                    <span>文件</span>
                </button>
                <button id="mobile-menu-special-update" class="flex items-center space-x-2 text-secondary py-2 hover:text-primary transition-colors">
                    <i class="fa fa-refresh w-5 text-center"></i>
                    <span>特殊更新</span>
                </button>
                <button id="mobile-menu-bank" class="flex items-center space-x-2 text-secondary py-2 hover:text-primary transition-colors">
                    <i class="fa fa-university w-5 text-center"></i>
                    <span>银行管理</span>
                </button>
                <button id="mobile-menu-validation" class="flex items-center space-x-2 text-secondary py-2 hover:text-primary transition-colors">
                    <i class="fa fa-check-square-o w-5 text-center"></i>
                    <span>简历校验</span>
                </button>
            </div>
        </div>
    </header>

    <!-- 主内容区 -->
    <main class="flex-grow container mx-auto px-4 py-6">
        <!-- 1. 技术人员信息解析部分 -->
        <section class="bg-white rounded-lg shadow-sm p-5 mb-6">
            <h2 class="text-lg font-semibold mb-4 flex items-center">
                <i class="fa fa-user-circle-o text-primary mr-2"></i>解析技术人员信息
            </h2>
            <div class="flex flex-col md:flex-row gap-4">
                <div class="flex-grow relative">
                    <input type="text" id="tech-info-path" class="w-full px-4 py-2 border border-gray-300 rounded-md focus:outline-none focus:ring-2 focus:ring-primary/50 focus:border-primary" placeholder="技术人员信息文件路径">
                    <button id="select-tech-info" class="absolute right-2 top-1/2 transform -translate-y-1/2 bg-primary text-white px-3 py-1 rounded text-sm hover:bg-primary/90 transition-colors">
                        选择Excel文件
                    </button>
                </div>
                <button id="parse-tech-info" class="bg-accent text-white px-5 py-2 rounded-md hover:bg-accent/90 transition-colors whitespace-nowrap">
                    <i class="fa fa-search mr-1"></i>解析信息
                </button>
            </div>
        </section>

        <!-- 2. 简历解析入库部分 -->
        <section class="bg-white rounded-lg shadow-sm p-5 mb-6">
            <h2 class="text-lg font-semibold mb-4 flex items-center">
                <i class="fa fa-database text-primary mr-2"></i>解析简历文件入库
            </h2>
            <div class="flex flex-col md:flex-row gap-4">
                <div class="flex-grow relative">
                    <input type="text" id="resume-folder-path" class="w-full px-4 py-2 border border-gray-300 rounded-md focus:outline-none focus:ring-2 focus:ring-primary/50 focus:border-primary" placeholder="简历文件夹路径">
                    <button id="select-resume-folder" class="absolute right-2 top-1/2 transform -translate-y-1/2 bg-primary text-white px-3 py-1 rounded text-sm hover:bg-primary/90 transition-colors">
                        选择文件夹
                    </button>
                </div>
                <button id="start-parse" class="bg-accent text-white px-5 py-2 rounded-md hover:bg-accent/90 transition-colors whitespace-nowrap">
                    <i class="fa fa-play mr-1"></i>开始解析
                </button>
            </div>
        </section>

        <!-- 3. 简历生成部分 -->
        <section class="bg-white rounded-lg shadow-sm p-5 mb-6">
            <h2 class="text-lg font-semibold mb-4 flex items-center">
                <i class="fa fa-file-pdf-o text-primary mr-2"></i>简历生成
            </h2>

            <!-- 生成方式选择 -->
            <div class="mb-4">
                <div class="flex flex-wrap gap-4">
                    <label class="inline-flex items-center cursor-pointer">
                        <input type="radio" name="generate-method" value="all" checked class="form-radio text-primary focus:ring-primary">
                        <span class="ml-2 text-gray-700">按名单生成简历</span>
                    </label>
                    <label class="inline-flex items-center cursor-pointer">
                        <input type="radio" name="generate-method" value="selected" class="form-radio text-primary focus:ring-primary">
                        <span class="ml-2 text-gray-700">自定义生成简历</span>
                    </label>
                </div>
            </div>

            <!-- 按名单生成简历框架 -->
            <div id="list-generate-frame" class="mb-5">
                <div class="border border-gray-200 rounded-lg p-4 bg-gray-50">
                    <h3 class="text-sm font-medium text-gray-700 mb-3">按名单选择人员</h3>
                    <div class="flex flex-col md:flex-row gap-3">
                        <div class="flex-grow relative">
                            <input type="text" id="list-file-path" class="w-full px-4 py-2 border border-gray-300 rounded-md focus:outline-none focus:ring-2 focus:ring-primary/50 focus:border-primary" placeholder="名单文件路径">
                            <button id="select-list-file" class="absolute right-2 top-1/2 transform -translate-y-1/2 bg-primary text-white px-3 py-1 rounded text-sm hover:bg-primary/90 transition-colors">
                                选择名单文件
                            </button>
                        </div>
                        <button id="confirm-list-selection" class="bg-accent text-white px-5 py-2 rounded-md hover:bg-accent/90 transition-colors whitespace-nowrap">
                            确认选择
                        </button>
                    </div>
                    <div class="mt-3 text-sm text-blue-600" id="selected-count">未选择任何人员</div>
                </div>
            </div>

            <!-- 自定义生成简历框架 -->
            <div id="custom-generate-frame" class="mb-5 hidden">
                <div class="border border-gray-200 rounded-lg p-4 bg-gray-50">
                    <h3 class="text-sm font-medium text-gray-700 mb-3 flex justify-between items-center">
                        <span>点选人员名单</span>
                        <div class="flex gap-2">
                            <button id="toggle-person-list" class="text-sm text-secondary hover:text-primary">
                                <i class="fa fa-chevron-up"></i> 折叠
                            </button>
                        </div>
                    </h3>

                    <!-- 人员名单控制区 -->
                    <div class="flex flex-wrap gap-3 mb-3">
                        <button id="update-person-list" class="bg-white border border-gray-300 text-gray-700 px-3 py-1 rounded text-sm hover:bg-gray-50 transition-colors">
                            更新人员名单
                        </button>
                        <button id="load-last-selected" class="bg-white border border-gray-300 text-gray-700 px-3 py-1 rounded text-sm hover:bg-gray-50 transition-colors">
                            上次选择人员
                        </button>
                        <div class="relative flex-grow max-w-md">
                            <span class="absolute left-3 top-1/2 transform -translate-y-1/2 text-gray-500">
                                <i class="fa fa-search"></i>
                            </span>
                            <input type="text" id="person-search" class="w-full pl-10 pr-4 py-1.5 border border-gray-300 rounded-md text-sm focus:outline-none focus:ring-2 focus:ring-primary/50 focus:border-primary" placeholder="搜索人员...">
                        </div>
                        <button id="confirm-person-selection" class="bg-primary text-white px-3 py-1 rounded text-sm hover:bg-primary/90 transition-colors whitespace-nowrap">
                            确认选择
                        </button>
                        <button id="clear-selection" class="bg-white border border-gray-300 text-gray-700 px-3 py-1 rounded text-sm hover:bg-gray-50 transition-colors whitespace-nowrap">
                            清除选择
                        </button>
                    </div>

                    <!-- 部门筛选 -->
                    <div class="flex flex-wrap gap-3 mb-3">
                        <div class="flex items-center">
                            <label for="level1-dept" class="text-sm text-gray-700 mr-2">一级部门:</label>
                            <select id="level1-dept" class="border border-gray-300 rounded-md text-sm px-2 py-1 focus:outline-none focus:ring-2 focus:ring-primary/50 focus:border-primary">
                                <option value="all">全部</option>
                            </select>
                        </div>
                        <div class="flex items-center">
                            <label for="level2-dept" class="text-sm text-gray-700 mr-2">二级部门:</label>
                            <select id="level2-dept" class="border border-gray-300 rounded-md text-sm px-2 py-1 focus:outline-none focus:ring-2 focus:ring-primary/50 focus:border-primary">
                                <option value="all">全部</option>
                            </select>
                        </div>
                        <button id="filter-by-dept" class="bg-white border border-gray-300 text-gray-700 px-3 py-1 rounded text-sm hover:bg-gray-50 transition-colors whitespace-nowrap">
                            部门筛选
                        </button>
                        <button id="clear-filters" class="bg-white border border-gray-300 text-gray-700 px-3 py-1 rounded text-sm hover:bg-gray-50 transition-colors whitespace-nowrap">
                            清除筛选
                        </button>
                    </div>

                    <!-- 人员列表 -->
                    <div class="border border-gray-200 rounded-md overflow-hidden">
                        <div class="grid grid-cols-[60px_100px_180px_1fr] bg-gray-100 text-sm font-medium text-gray-700">
                            <div class="flex items-center justify-center py-2 border-b border-gray-200">选择</div>
                            <div class="flex items-center py-2 border-b border-gray-200 pl-3">员工编号</div>
                            <div class="flex items-center py-2 border-b border-gray-200 pl-3">人员姓名</div>
                            <div class="flex items-center py-2 border-b border-gray-200 pl-3">部门</div>
                        </div>
                        <div id="person-list-container" class="max-h-60 overflow-y-auto">
                            <div id="person-list" class="text-sm">
                                <!-- 人员列表将通过JavaScript动态生成 -->
                                <div class="grid grid-cols-[60px_100px_180px_1fr] py-2 border-b border-gray-100 hover:bg-gray-50 animate-pulse">
                                    <div class="flex items-center justify-center"><i class="fa fa-spinner fa-spin text-gray-400"></i></div>
                                    <div class="flex items-center pl-3 text-gray-400">加载中...</div>
                                    <div class="flex items-center pl-3 text-gray-400"></div>
                                    <div class="flex items-center pl-3 text-gray-400"></div>
                                </div>
                            </div>
                        </div>
                    </div>
                </div>
            </div>

            <!-- 银行选择和生成按钮 -->
            <div class="flex flex-wrap items-center gap-4">
                <div class="flex items-center">
                    <div id="bank-logo" class="w-10 h-10 border border-gray-300 flex items-center justify-center mr-3">
                        <i class="fa fa-university text-gray-400"></i>
                    </div>
                    <div>
                        <label for="bank-select" class="text-sm text-gray-700 block mb-1">银行:</label>
                        <select id="bank-select" class="border border-gray-300 rounded-md text-sm px-3 py-2 focus:outline-none focus:ring-2 focus:ring-primary/50 focus:border-primary">
                            <!-- 银行列表将通过JavaScript动态生成 -->
                        </select>
                    </div>
                </div>
                <button id="generate-resumes" class="bg-green-600 text-white px-6 py-2 rounded-md hover:bg-green-700 transition-colors ml-auto">
                    <i class="fa fa-file-pdf-o mr-1"></i>生成简历
                </button>
            </div>
        </section>

        <!-- 4. 进度条 -->
        <section class="bg-white rounded-lg shadow-sm p-5 mb-6">
            <div class="w-full bg-gray-200 rounded-full h-2.5 mb-2">
                <div id="progress-bar" class="bg-primary h-2.5 rounded-full" style="width: 0%"></div>
            </div>
            <div class="text-right text-sm text-gray-600" id="progress-text">0%</div>
        </section>

        <!-- 5. 日志显示区域 -->
        <section class="bg-white rounded-lg shadow-sm p-5">
            <h2 class="text-lg font-semibold mb-4 flex items-center">
                <i class="fa fa-file-text-o text-primary mr-2"></i>日志信息
            </h2>
            <div id="log-container" class="border border-gray-200 rounded-md h-60 overflow-y-auto bg-gray-50 p-3 text-sm font-mono text-gray-700 scrollbar-thin">
                <div id="log-content">
                    <!-- 日志内容将通过JavaScript动态生成 -->
                    <div class="text-gray-500">应用启动中...</div>
                </div>
            </div>
        </section>
    </main>

    <!-- 页脚 -->
    <footer class="bg-white border-t border-gray-light py-4 mt-6">
        <div class="container mx-auto px-4 text-center text-sm text-gray-500">
            <p>简历生成器 v1.0 | 版权所有 © 2023</p>
        </div>
    </footer>

    <!-- 模态框 -->
    <div id="modal-overlay" class="fixed inset-0 bg-black bg-opacity-50 z-50 hidden flex items-center justify-center p-4">
        <div id="modal-container" class="bg-white rounded-lg shadow-lg w-full max-w-2xl max-h-[90vh] flex flex-col">
            <div class="modal-header p-4 border-b border-gray-200 flex justify-between items-center">
                <h3 id="modal-title" class="text-lg font-semibold">模态框标题</h3>
                <button id="modal-close" class="text-gray-500 hover:text-gray-700">
                    <i class="fa fa-times"></i>
                </button>
            </div>
            <div id="modal-body" class="p-4 overflow-y-auto flex-grow">
                <!-- 模态框内容将通过JavaScript动态生成 -->
            </div>
            <div class="modal-footer p-4 border-t border-gray-200 flex justify-end gap-3">
                <button id="modal-cancel" class="px-4 py-2 border border-gray-300 rounded-md text-gray-700 hover:bg-gray-50 transition-colors">取消</button>
                <button id="modal-confirm" class="px-4 py-2 bg-primary text-white rounded-md hover:bg-primary/90 transition-colors">确认</button>
            </div>
        </div>
    </div>

    <script>
        // 全局状态
        const state = {
            generateMethod: 'all',
            selectedEmployees: [],
            employeeList: [],
            bankList: [],
            departments: {
                level1: [],
                level2: {}
            },
            currentModal: null
        };

        // DOM元素引用
        const elements = {
            // 菜单按钮
            menuFile: document.getElementById('menu-file'),
            menuSpecialUpdate: document.getElementById('menu-special-update'),
            menuBank: document.getElementById('menu-bank'),
            menuValidation: document.getElementById('menu-validation'),
            mobileMenuButton: document.getElementById('mobile-menu-button'),
            mobileMenu: document.getElementById('mobile-menu'),
            mobileMenuItems: {
                file: document.getElementById('mobile-menu-file'),
                specialUpdate: document.getElementById('mobile-menu-special-update'),
                bank: document.getElementById('mobile-menu-bank'),
                validation: document.getElementById('mobile-menu-validation')
            },

            // 技术人员信息解析
            techInfoPath: document.getElementById('tech-info-path'),
            selectTechInfo: document.getElementById('select-tech-info'),
            parseTechInfo: document.getElementById('parse-tech-info'),

            // 简历解析入库
            resumeFolderPath: document.getElementById('resume-folder-path'),
            selectResumeFolder: document.getElementById('select-resume-folder'),
            startParse: document.getElementById('start-parse'),

            // 生成方式选择
            generateMethodRadios: document.querySelectorAll('input[name="generate-method"]'),
            listGenerateFrame: document.getElementById('list-generate-frame'),
            customGenerateFrame: document.getElementById('custom-generate-frame'),

            // 按名单生成
            listFilePath: document.getElementById('list-file-path'),
            selectListFile: document.getElementById('select-list-file'),
            confirmListSelection: document.getElementById('confirm-list-selection'),
            selectedCount: document.getElementById('selected-count'),

            // 自定义生成
            togglePersonList: document.getElementById('toggle-person-list'),
            updatePersonList: document.getElementById('update-person-list'),
            loadLastSelected: document.getElementById('load-last-selected'),
            personSearch: document.getElementById('person-search'),
            confirmPersonSelection: document.getElementById('confirm-person-selection'),
            clearSelection: document.getElementById('clear-selection'),
            level1Dept: document.getElementById('level1-dept'),
            level2Dept: document.getElementById('level2-dept'),
            filterByDept: document.getElementById('filter-by-dept'),
            clearFilters: document.getElementById('clear-filters'),
            personList: document.getElementById('person-list'),

            // 银行选择和生成按钮
            bankLogo: document.getElementById('bank-logo'),
            bankSelect: document.getElementById('bank-select'),
            generateResumes: document.getElementById('generate-resumes'),

            // 进度条
            progressBar: document.getElementById('progress-bar'),
            progressText: document.getElementById('progress-text'),

            // 日志
            logContent: document.getElementById('log-content'),

            // 模态框
            modalOverlay: document.getElementById('modal-overlay'),
            modalContainer: document.getElementById('modal-container'),
            modalTitle: document.getElementById('modal-title'),
            modalBody: document.getElementById('modal-body'),
            modalFooter: document.querySelector('.modal-footer'),
            modalClose: document.getElementById('modal-close'),
            modalCancel: document.getElementById('modal-cancel'),
            modalConfirm: document.getElementById('modal-confirm')
        };

        // 工具函数
        const utils = {
            /**
             * 添加日志信息
             * @param {string} message 日志消息
             * @param {string} type 日志类型 (info, success, warning, error)
             */
            log(message, type = 'info') {
                const logElement = document.createElement('div');
                const timestamp = new Date().toLocaleTimeString();
                let icon = 'info-circle';
                let colorClass = 'text-gray-700';

                switch(type) {
                    case 'success':
                        icon = 'check-circle';
                        colorClass = 'text-green-600';
                        break;
                    case 'warning':
                        icon = 'exclamation-circle';
                        colorClass = 'text-yellow-600';
                        break;
                    case 'error':
                        icon = 'times-circle';
                        colorClass = 'text-red-600';
                        break;
                }

                logElement.className = `mb-1 ${colorClass}`;
                logElement.innerHTML = `[${timestamp}] <i class="fa fa-${icon} mr-1"></i> ${message}`;
                elements.logContent.appendChild(logElement);
                if (elements.logContainer) { elements.logContainer.scrollTop = elements.logContainer.scrollHeight; }
            },

            /**
             * 更新进度条
             * @param {number} percentage 进度百分比
             */
            updateProgress(percentage) {
                percentage = Math.max(0, Math.min(100, percentage));
                elements.progressBar.style.width = `${percentage}%`;
                elements.progressText.textContent = `${percentage}%`;
            },

            /**
             * 显示模态框
             * @param {Object} options 模态框选项
             * @param {string} options.title 标题
             * @param {string} options.content 内容HTML
             * @param {Function} options.onConfirm 确认回调
             * @param {Function} options.onCancel 取消回调
             * @param {boolean} options.showCancel 是否显示取消按钮
             */
            showModal(options) {
                state.currentModal = options;
                elements.modalTitle.textContent = options.title || '提示';
                elements.modalBody.innerHTML = options.content || '';
                elements.modalConfirm.onclick = () => {
                    if (options.onConfirm) options.onConfirm();
                    utils.hideModal();
                };
                elements.modalCancel.onclick = () => {
                    if (options.onCancel) options.onCancel();
                    utils.hideModal();
                };
                elements.modalClose.onclick = utils.hideModal;
                elements.modalOverlay.onclick = (e) => {
                    if (e.target === elements.modalOverlay) utils.hideModal();
                };

                if (options.showCancel === false) {
                    elements.modalCancel.classList.add('hidden');
                } else {
                    elements.modalCancel.classList.remove('hidden');
                }

                elements.modalOverlay.classList.remove('hidden');
            },

            /**
             * 隐藏模态框
             */
            hideModal() {
                elements.modalOverlay.classList.add('hidden');
                state.currentModal = null;
            },

            /**
             * 显示消息提示
             * @param {string} message 消息内容
             * @param {string} type 消息类型 (info, success, warning, error)
             */
            showMessage(message, type = 'info') {
                let icon = 'info-circle';
                let title = '提示';
                let colorClass = 'text-blue-600';

                switch(type) {
                    case 'success':
                        icon = 'check-circle';
                        title = '成功';
                        colorClass = 'text-green-600';
                        break;
                    case 'warning':
                        icon = 'exclamation-circle';
                        title = '警告';
                        colorClass = 'text-yellow-600';
                        break;
                    case 'error':
                        icon = 'times-circle';
                        title = '错误';
                        colorClass = 'text-red-600';
                        break;
                }

                utils.showModal({
                    title,
                    content: `<div class="text-center py-4"><i class="fa fa-${icon} text-5xl ${colorClass} mb-4"></i><p>${message}</p></div>`,
                    showCancel: false,
                    onConfirm: () => {}
                });
            }
        };

        // API调用函数
        const api = {
            /**
             * 获取银行列表
             */
            async getBankList() {
                try {
                    const response = await fetch('/api/banks');
                    if (!response.ok) throw new Error('获取银行列表失败');
                    const data = await response.json();
                    state.bankList = data;
                    render.renderBankList();
                    return data;
                } catch (error) {
                    utils.log(`获取银行列表失败: ${error.message}`, 'error');
                    // 使用默认银行列表
                    state.bankList = ['长亮科技', '测试银行', '招商银行', '建设银行', '工商银行', '农业银行'];
                    render.renderBankList();
                }
            },

            /**
             * 获取员工列表
             */
            async getEmployeeList() {
                try {
                    utils.log('正在获取员工列表...');
                    utils.updateProgress(30);
                    const response = await fetch('/api/employees');
                    if (!response.ok) throw new Error('获取员工列表失败');
                    const data = await response.json();
                    state.employeeList = data;
                    utils.log(`成功获取 ${data.length} 条员工信息`);
                    utils.updateProgress(60);

                    // 提取部门信息
                    const level1Depts = new Set();
                    const level2Depts = {};

                    data.forEach(emp => {
                        const level1 = emp.Level1Dept || '';
                        const level2 = emp.Level2Dept || '';

                        if (level1) {
                            level1Depts.add(level1);
                            if (!level2Depts[level1]) {
                                level2Depts[level1] = new Set();
                            }
                            if (level2) {
                                level2Depts[level1].add(level2);
                            }
                        }
                    });

                    state.departments.level1 = Array.from(level1Depts);
                    state.departments.level2 = {};
                    Object.keys(level2Depts).forEach(level1 => {
                        state.departments.level2[level1] = Array.from(level2Depts[level1]);
                    });

                    render.renderDepartmentFilters();
                    render.renderEmployeeList();
                    utils.updateProgress(100);
                    return data;
                } catch (error) {
                    utils.log(`获取员工列表失败: ${error.message}`, 'error');
                    utils.updateProgress(0);
                }
            },

            /**
             * 解析技术人员信息
             * @param {string} filePath 文件路径
             */
            async parseTechInfo(filePath) {
                try {
                    utils.log(`开始解析技术人员信息文件: ${filePath}`);
                    utils.updateProgress(10);
                    const response = await fetch('/api/parse-tech-info', {
                        method: 'POST',
                        headers: {'Content-Type': 'application/json'},
                        body: JSON.stringify({ file_path: filePath })
                    });

                    if (!response.ok) throw new Error('解析失败');
                    const result = await response.json();
                    utils.log('技术人员信息解析完成', 'success');
                    utils.updateProgress(100);
                    utils.showMessage('技术人员信息解析完成', 'success');
                    return result;
                } catch (error) {
                    utils.log(`解析技术人员信息失败: ${error.message}`, 'error');
                    utils.updateProgress(0);
                }
            },

            /**
             * 开始解析简历文件
             * @param {string} folderPath 文件夹路径
             */
            async startParse(folderPath) {
                try {
                    utils.log(`开始解析简历文件夹: ${folderPath}`);
                    utils.updateProgress(0);
                    const response = await fetch('/api/parse-resumes', {
                        method: 'POST',
                        headers: {'Content-Type': 'application/json'},
                        body: JSON.stringify({ folder_path: folderPath })
                    });

                    if (!response.ok) throw new Error('解析失败');

                    // 创建一个EventSource来监听进度更新
                    const eventSource = new EventSource(`/api/parse-progress`);

                    eventSource.onmessage = (event) => {
                        const data = JSON.parse(event.data);
                        utils.updateProgress(data.progress);
                        utils.log(data.message);

                        if (data.progress === 100) {
                            eventSource.close();
                            utils.showMessage('简历解析完成', 'success');
                        }
                    };

                    eventSource.onerror = () => {
                        eventSource.close();
                        utils.log('解析过程中发生错误', 'error');
                        utils.showMessage('解析过程中发生错误', 'error');
                    };

                    return true;
                } catch (error) {
                    utils.log(`开始解析简历失败: ${error.message}`, 'error');
                    utils.showMessage(`解析失败: ${error.message}`, 'error');
                }
            },

            /**
             * 生成简历
             * @param {Array} employeeIds 员工ID列表
             * @param {string} bankName 银行名称
             */
            async generateResumes(employeeIds, bankName) {
                try {
                    utils.log(`开始生成简历，共 ${employeeIds.length} 人，银行: ${bankName}`);
                    utils.updateProgress(0);
                    const response = await fetch('/api/generate-resumes', {
                        method: 'POST',
                        headers: {'Content-Type': 'application/json'},
                        body: JSON.stringify({
                            employee_ids: employeeIds,
                            bank_name: bankName
                        })
                    });

                    if (!response.ok) throw new Error('生成简历失败');

                    // 创建一个EventSource来监听进度更新
                    const eventSource = new EventSource(`/api/generate-progress`);

                    eventSource.onmessage = (event) => {
                        const data = JSON.parse(event.data);
                        utils.updateProgress(data.progress);
                        utils.log(data.message);

                        if (data.progress === 100) {
                            eventSource.close();
                            utils.showMessage('简历生成完成', 'success');
                        }
                    };

                    eventSource.onerror = () => {
                        eventSource.close();
                        utils.log('生成过程中发生错误', 'error');
                        utils.showMessage('生成过程中发生错误', 'error');
                    };

                    return true;
                } catch (error) {
                    utils.log(`生成简历失败: ${error.message}`, 'error');
                    utils.showMessage(`生成失败: ${error.message}`, 'error');
                }
            }
        };

        // 渲染函数
        const render = {
            /**
             * 渲染银行列表
             */
            renderBankList() {
                const select = elements.bankSelect;
                select.innerHTML = '';

                state.bankList.forEach(bank => {
                    const option = document.createElement('option');
                    option.value = bank;
                    option.textContent = bank;
                    select.appendChild(option);
                });

                // 默认选择第一个银行
                if (state.bankList.length > 0) {
                    select.value = state.bankList[0];
                    render.updateBankLogo(state.bankList[0]);
                }
            },

            /**
             * 更新银行Logo
             * @param {string} bankName 银行名称
             */
            updateBankLogo(bankName) {
                // 在实际应用中，这里应该从服务器获取银行Logo
                // 这里使用简单的图标代替
                elements.bankLogo.innerHTML = `<i class="fa fa-university text-primary"></i>`;
            },

            /**
             * 渲染部门筛选器
             */
            renderDepartmentFilters() {
                const level1Select = elements.level1Dept;
                const level2Select = elements.level2Dept;

                // 保存当前选中值
                const currentLevel1 = level1Select.value;
                const currentLevel2 = level2Select.value;

                // 清空选择框
                level1Select.innerHTML = '<option value="all">全部</option>';
                level2Select.innerHTML = '<option value="all">全部</option>';

                // 添加一级部门
                state.departments.level1.forEach(dept => {
                    const option = document.createElement('option');
                    option.value = dept;
                    option.textContent = dept;
                    level1Select.appendChild(option);
                });

                // 恢复选中值或选择第一个
                if (currentLevel1 && state.departments.level1.includes(currentLevel1)) {
                    level1Select.value = currentLevel1;
                    // 添加二级部门
                    if (state.departments.level2[currentLevel1]) {
                        state.departments.level2[currentLevel1].forEach(dept => {
                            const option = document.createElement('option');
                            option.value = dept;
                            option.textContent = dept;
                            level2Select.appendChild(option);
                        });
                        // 恢复二级部门选中值
                        if (currentLevel2 && state.departments.level2[currentLevel1].includes(currentLevel2)) {
                            level2Select.value = currentLevel2;
                        }
                    }
                } else if (state.departments.level1.length > 0) {
                    level1Select.value = state.departments.level1[0];
                    // 添加二级部门
                    if (state.departments.level2[state.departments.level1[0]]) {
                        state.departments.level2[state.departments.level1[0]].forEach(dept => {
                            const option = document.createElement('option');
                            option.value = dept;
                            option.textContent = dept;
                            level2Select.appendChild(option);
                        });
                    }
                }
            },

            /**
             * 渲染员工列表
             * @param {Array} filteredList 筛选后的列表，为空则使用全部
             */
            renderEmployeeList(filteredList = null) {
                const listElement = elements.personList;
                const employees = filteredList || state.employeeList;

                if (employees.length === 0) {
                    listElement.innerHTML = `
                        <div class="grid grid-cols-[60px_100px_180px_1fr] py-4 text-center text-gray-500 border-b border-gray-100">
                            <div colspan="4">未找到员工信息，请先更新人员名单</div>
                        </div>
                    `;
                    return;
                }

                listElement.innerHTML = '';

                employees.forEach(emp => {
                    const isSelected = state.selectedEmployees.includes(emp.EmpNo);
                    const deptInfo = emp.Level1Dept && emp.Level2Dept
                        ? `${emp.Level1Dept}-${emp.Level2Dept}`
                        : emp.Level1Dept || emp.Level2Dept || '未分配';

                    const row = document.createElement('div');
                    row.className = `grid grid-cols-[60px_100px_180px_1fr] py-2 border-b border-gray-100 hover:bg-gray-50 cursor-pointer treeview-row ${isSelected ? 'treeview-row-selected' : ''}`;
                    row.dataset.empNo = emp.EmpNo;
                    row.innerHTML = `
                        <div class="flex items-center justify-center">${isSelected ? '<i class="fa fa-check text-primary"></i>' : ''}</div>
                        <div class="flex items-center pl-3">${emp.EmpNo}</div>
                        <div class="flex items-center pl-3">${emp.JobName || '未知姓名'}</div>
                        <div class="flex items-center pl-3">${deptInfo}</div>
                    `;

                    row.addEventListener('click', () => {
                        const empNo = row.dataset.empNo;
                        const index = state.selectedEmployees.indexOf(empNo);

                        if (index === -1) {
                            state.selectedEmployees.push(empNo);
                            row.classList.add('treeview-row-selected');
                            row.querySelector('div:first-child').innerHTML = '<i class="fa fa-check text-primary"></i>';
                        } else {
                            state.selectedEmployees.splice(index, 1);
                            row.classList.remove('treeview-row-selected');
                            row.querySelector('div:first-child').innerHTML = '';
                        }
                    });

                    listElement.appendChild(row);
                });
            }
        };

        // 事件监听器设置
        function setupEventListeners() {
            // 移动端菜单切换
            elements.mobileMenuButton.addEventListener('click', () => {
                elements.mobileMenu.classList.toggle('hidden');
            });

            // 生成方式切换
            elements.generateMethodRadios.forEach(radio => {
                radio.addEventListener('change', (e) => {
                    state.generateMethod = e.target.value;
                    if (state.generateMethod === 'all') {
                        elements.listGenerateFrame.classList.remove('hidden');
                        elements.customGenerateFrame.classList.add('hidden');
                    } else {
                        elements.listGenerateFrame.classList.add('hidden');
                        elements.customGenerateFrame.classList.remove('hidden');
                        // 如果是第一次切换到自定义生成，加载员工列表
                        if (state.employeeList.length === 0) {
                            api.getEmployeeList();
                        }
                    }
                });
            });

            // 人员列表折叠/展开
            elements.togglePersonList.addEventListener('click', () => {
                const container = document.getElementById('person-list-container');
                const icon = elements.togglePersonList.querySelector('i');
                const text = elements.togglePersonList.childNodes[2].textContent.trim();

                if (text === '折叠') {
                    container.style.maxHeight = '0';
                    container.style.overflow = 'hidden';
                    icon.className = 'fa fa-chevron-down';
                    elements.togglePersonList.childNodes[2].textContent = ' 展开';
                } else {
                    container.style.maxHeight = '300px';
                    container.style.overflow = 'auto';
                    icon.className = 'fa fa-chevron-up';
                    elements.togglePersonList.childNodes[2].textContent = ' 折叠';
                }
            });

            // 更新人员名单
            elements.updatePersonList.addEventListener('click', () => {
                api.getEmployeeList();
            });

            // 加载上次选择
            elements.loadLastSelected.addEventListener('click', () => {
                utils.log('正在加载上次选择的人员...');
                // 在实际应用中，这里应该从服务器加载上次选择
                // 这里使用模拟数据
                state.selectedEmployees = ['1001', '1002', '1003'];
                render.renderEmployeeList();
                utils.log(`已加载上次选择的 ${state.selectedEmployees.length} 人`);
            });

            // 清除选择
            elements.clearSelection.addEventListener('click', () => {
                state.selectedEmployees = [];
                render.renderEmployeeList();
                utils.log('已清除所有选择');
            });

            // 确认选择
            elements.confirmPersonSelection.addEventListener('click', () => {
                if (state.selectedEmployees.length === 0) {
                    utils.showMessage('请先选择人员', 'warning');
                    return;
                }
                utils.log(`已确认选择 ${state.selectedEmployees.length} 人`);
                utils.showMessage(`已选择 ${state.selectedEmployees.length} 人`, 'success');
            });

            // 一级部门变化时更新二级部门
            elements.level1Dept.addEventListener('change', () => {
                const selectedLevel1 = elements.level1Dept.value;
                const level2Select = elements.level2Dept;

                level2Select.innerHTML = '<option value="all">全部</option>';

                if (selectedLevel1 !== 'all' && state.departments.level2[selectedLevel1]) {
                    state.departments.level2[selectedLevel1].forEach(dept => {
                        const option = document.createElement('option');
                        option.value = dept;
                        option.textContent = dept;
                        level2Select.appendChild(option);
                    });
                }
            });

            // 部门筛选
            elements.filterByDept.addEventListener('click', () => {
                const level1 = elements.level1Dept.value;
                const level2 = elements.level2Dept.value;

                if (level1 === 'all' && level2 === 'all') {
                    render.renderEmployeeList();
                    return;
                }

                const filteredList = state.employeeList.filter(emp => {
                    const empLevel1 = emp.Level1Dept || '';
                    const empLevel2 = emp.Level2Dept || '';

                    if (level1 !== 'all' && level1 !== empLevel1) return false;
                    if (level2 !== 'all' && level2 !== empLevel2) return false;
                    return true;
                });

                render.renderEmployeeList(filteredList);
                utils.log(`筛选出 ${filteredList.length} 名员工`);
            });

            // 清除筛选
            elements.clearFilters.addEventListener('click', () => {
                elements.level1Dept.value = 'all';
                elements.level2Dept.innerHTML = '<option value="all">全部</option>';
                render.renderEmployeeList();
                utils.log('已清除所有筛选条件');
            });

            // 搜索人员
            elements.personSearch.addEventListener('input', (e) => {
                const searchText = e.target.value.toLowerCase();
                if (!searchText) {
                    render.renderEmployeeList();
                    return;
                }

                const filteredList = state.employeeList.filter(emp => {
                    const empNo = emp.EmpNo.toLowerCase();
                    const name = (emp.JobName || '').toLowerCase();
                    const dept = `${emp.Level1Dept || ''}${emp.Level2Dept || ''}`.toLowerCase();

                    return empNo.includes(searchText) || name.includes(searchText) || dept.includes(searchText);
                });

                render.renderEmployeeList(filteredList);
            });

            // 银行选择变化
            elements.bankSelect.addEventListener('change', (e) => {
                render.updateBankLogo(e.target.value);
            });

            // 生成简历
            elements.generateResumes.addEventListener('click', () => {
                const bankName = elements.bankSelect.value;
                let employeeIds = [];

                if (state.generateMethod === 'all') {
                    // 在实际应用中，这里应该从名单文件获取
                    // 这里使用模拟数据
                    employeeIds = ['1001', '1002', '1003', '1004', '1005'];
                } else {
                    employeeIds = state.selectedEmployees;
                }

                if (employeeIds.length === 0) {
                    utils.showMessage('请先选择人员', 'warning');
                    return;
                }

                if (!bankName) {
                    utils.showMessage('请选择银行', 'warning');
                    return;
                }

                api.generateResumes(employeeIds, bankName);
            });

            // 菜单按钮事件
            elements.menuFile.addEventListener('click', () => {
                utils.showMessage('文件菜单功能待实现', 'info');
            });

            elements.menuSpecialUpdate.addEventListener('click', () => {
                utils.showMessage('特殊更新功能待实现', 'info');
            });

            elements.menuBank.addEventListener('click', () => {
                utils.showMessage('银行管理功能待实现', 'info');
            });

            elements.menuValidation.addEventListener('click', () => {
                utils.showMessage('简历校验功能待实现', 'info');
            });

            // 移动端菜单按钮事件
            elements.mobileMenuItems.file.addEventListener('click', () => {
                elements.mobileMenu.classList.add('hidden');
                utils.showMessage('文件菜单功能待实现', 'info');
            });

            elements.mobileMenuItems.specialUpdate.addEventListener('click', () => {
                elements.mobileMenu.classList.add('hidden');
                utils.showMessage('特殊更新功能待实现', 'info');
            });

            elements.mobileMenuItems.bank.addEventListener('click', () => {
                elements.mobileMenu.classList.add('hidden');
                utils.showMessage('银行管理功能待实现', 'info');
            });

            elements.mobileMenuItems.validation.addEventListener('click', () => {
                elements.mobileMenu.classList.add('hidden');
                utils.showMessage('简历校验功能待实现', 'info');
            });

            // 解析技术人员信息
            elements.parseTechInfo.addEventListener('click', () => {
                const filePath = elements.techInfoPath.value;
                if (!filePath) {
                    utils.showMessage('请选择技术人员信息文件', 'warning');
                    return;
                }
                api.parseTechInfo(filePath);
            });

            // 开始解析
            elements.startParse.addEventListener('click', () => {
                const folderPath = elements.resumeFolderPath.value;
                if (!folderPath) {
                    utils.showMessage('请选择简历文件夹', 'warning');
                    return;
                }
                api.startParse(folderPath);
            });

            // 选择技术人员信息文件
            elements.selectTechInfo.addEventListener('click', () => {
                // 在实际应用中，这里应该打开文件选择对话框
                // 这里使用模拟路径
                elements.techInfoPath.value = 'C:/data/技术人员信息.xlsx';
            });

            // 选择简历文件夹
            elements.selectResumeFolder.addEventListener('click', () => {
                // 在实际应用中，这里应该打开文件夹选择对话框
                // 使用模拟路径
                elements.resumeFolderPath.value = 'C:/resumes/';
            });

            // 选择名单文件
            elements.selectListFile.addEventListener('click', () => {
                // 在实际应用中，这里应该打开文件选择对话框
                // 使用模拟路径
                elements.listFilePath.value = 'C:/data/人员名单.txt';
                elements.selectedCount.textContent = '已选择文件，请点击\'确认选择\'导入名单';
            });

            // 确认名单选择
            elements.confirmListSelection.addEventListener('click', () => {
                const filePath = elements.listFilePath.value;
                if (!filePath) {
                    utils.showMessage('请选择名单文件', 'warning');
                    return;
                }
                // 在实际应用中，这里应该解析文件并获取员工ID
                // 这里使用模拟数据
                const count = 10;
                elements.selectedCount.textContent = `已选择 ${count} 人`;
                utils.log(`成功导入名单，共 ${count} 人`);
                utils.showMessage(`成功导入 ${count} 人`, 'success');
            });
        }

        // 初始化应用
        function init() {
            utils.log('应用启动成功');
            setupEventListeners();
            api.getBankList();
        }

        // 当DOM加载完成后初始化应用
        document.addEventListener('DOMContentLoaded', init);
    </script>
</body>
</html>
