<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>长亮科技简历生成器</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="stylesheet" href="static/css/style.css">
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        primary: '#165DFF',
                        secondary: '#6B7280',
                        accent: '#3B82F6',
                        success: '#10B981',
                        warning: '#F59E0B',
                        danger: '#EF4444',
                        light: '#F3F4F6',
                        dark: '#1F2937'
                    },
                    fontFamily: {
                        sans: ['Inter', 'system-ui', 'sans-serif'],
                    },
                }
            }
        }
    </script>
    <style type="text/tailwindcss">
        @layer utilities {
            .content-auto {
                content-visibility: auto;
            }
            .scrollbar-thin {
                scrollbar-width: thin;
            }
            .scrollbar-hide::-webkit-scrollbar {
                display: none;
            }
            .transition-height {
                transition: max-height 0.3s ease-out;
            }
            .treeview-row:hover {
                background-color: rgba(22, 93, 255, 0.05);
            }
            .treeview-row-selected {
                background-color: rgba(22, 93, 255, 0.1);
            }
        }
    </style>
</head>
<body class="bg-gray-50 min-h-screen flex flex-col">
    <!-- 顶部导航栏 -->
    <header class="bg-white shadow-sm sticky top-0 z-10">
        <div class="container mx-auto px-4 py-3 flex justify-between items-center">
            <div class="flex items-center space-x-2">
                <i class="fas fa-file-alt text-primary text-2xl"></i>
                <h1 class="text-xl font-bold text-dark">长亮科技简历生成器</h1>
            </div>
            <nav class="hidden md:flex space-x-6">
                <button id="menu-file" class="flex items-center space-x-1 text-secondary hover:text-primary transition-colors">
                    <i class="fas fa-file"></i>
                    <span>文件</span>
                </button>
                <button id="menu-special-update" class="flex items-center space-x-1 text-secondary hover:text-primary transition-colors">
                    <i class="fas fa-sync-alt"></i>
                    <span>特殊更新</span>
                </button>
                <button id="menu-bank" class="flex items-center space-x-1 text-secondary hover:text-primary transition-colors">
                    <i class="fas fa-university"></i>
                    <span>银行管理</span>
                </button>
                <button id="menu-validation" class="flex items-center space-x-1 text-secondary hover:text-primary transition-colors">
                    <i class="fas fa-check-square"></i>
                    <span>简历校验</span>
                </button>
            </nav>
            <button id="mobile-menu-button" class="md:hidden text-secondary hover:text-primary">
                <i class="fas fa-bars text-xl"></i>
            </button>
        </div>
        <!-- 移动端菜单 -->
        <div id="mobile-menu" class="hidden md:hidden bg-white shadow-md absolute w-full">
            <div class="container mx-auto px-4 py-2 flex flex-col space-y-3">
                <button id="mobile-menu-file" class="flex items-center space-x-2 text-secondary py-2 hover:text-primary transition-colors">
                    <i class="fas fa-file w-5 text-center"></i>
                    <span>文件</span>
                </button>
                <button id="mobile-menu-special-update" class="flex items-center space-x-2 text-secondary py-2 hover:text-primary transition-colors">
                    <i class="fas fa-sync-alt w-5 text-center"></i>
                    <span>特殊更新</span>
                </button>
                <button id="mobile-menu-bank" class="flex items-center space-x-2 text-secondary py-2 hover:text-primary transition-colors">
                    <i class="fas fa-university w-5 text-center"></i>
                    <span>银行管理</span>
                </button>
                <button id="mobile-menu-validation" class="flex items-center space-x-2 text-secondary py-2 hover:text-primary transition-colors">
                    <i class="fas fa-check-square w-5 text-center"></i>
                    <span>简历校验</span>
                </button>
            </div>
        </div>
    </header>

    <!-- 主内容区 -->
    <main class="flex-grow container mx-auto px-4 py-6">
        <!-- 1. 技术人员信息解析部分 -->
        <section class="bg-white rounded-lg shadow-sm p-5 mb-6">
            <h2 class="text-lg font-semibold mb-4 flex items-center">
                <i class="fas fa-user-circle text-primary mr-2"></i>解析技术人员信息
            </h2>
            <div class="flex flex-col md:flex-row gap-4">
                <div class="flex-grow relative">
                    <input type="text" id="tech-info-path" class="w-full px-4 py-2 border border-gray-300 rounded-md focus:outline-none focus:ring-2 focus:ring-primary/50 focus:border-primary" placeholder="技术人员信息文件路径">
                    <button id="select-tech-info" class="absolute right-2 top-1/2 transform -translate-y-1/2 bg-primary text-white px-3 py-1 rounded text-sm hover:bg-primary/90 transition-colors">
                        选择Excel文件
                    </button>
                </div>
                <button id="parse-tech-info" class="bg-accent text-white px-5 py-2 rounded-md hover:bg-accent/90 transition-colors whitespace-nowrap">
                    <i class="fas fa-search mr-1"></i>解析信息
                </button>
            </div>
        </section>

        <!-- 2. 简历解析入库部分 -->
        <section class="bg-white rounded-lg shadow-sm p-5 mb-6">
            <h2 class="text-lg font-semibold mb-4 flex items-center">
                <i class="fas fa-database text-primary mr-2"></i>解析简历文件入库
            </h2>
            <div class="flex flex-col md:flex-row gap-4">
                <div class="flex-grow relative">
                    <input type="text" id="resume-folder-path" class="w-full px-4 py-2 border border-gray-300 rounded-md focus:outline-none focus:ring-2 focus:ring-primary/50 focus:border-primary" placeholder="简历文件夹路径">
                    <button id="select-resume-folder" class="absolute right-2 top-1/2 transform -translate-y-1/2 bg-primary text-white px-3 py-1 rounded text-sm hover:bg-primary/90 transition-colors">
                        选择文件夹
                    </button>
                </div>
                <button id="start-parse" class="bg-accent text-white px-5 py-2 rounded-md hover:bg-accent/90 transition-colors whitespace-nowrap">
                    <i class="fas fa-play mr-1"></i>开始解析
                </button>
            </div>
        </section>

        <!-- 3. 简历生成部分 -->
        <section class="bg-white rounded-lg shadow-sm p-5 mb-6">
            <h2 class="text-lg font-semibold mb-4 flex items-center">
                <i class="fas fa-file-word text-primary mr-2"></i>简历生成
            </h2>

            <!-- 生成方式选择 -->
            <div class="mb-4">
                <div class="flex flex-wrap gap-4">
                    <label class="inline-flex items-center cursor-pointer">
                        <input type="radio" name="generate-method" value="all" checked class="form-radio text-primary focus:ring-primary">
                        <span class="ml-2 text-gray-700">按名单生成简历</span>
                    </label>
                    <label class="inline-flex items-center cursor-pointer">
                        <input type="radio" name="generate-method" value="selected" class="form-radio text-primary focus:ring-primary">
                        <span class="ml-2 text-gray-700">自定义生成简历</span>
                    </label>
                </div>
            </div>

            <!-- 按名单生成简历框架 -->
            <div id="list-generate-frame" class="mb-5">
                <div class="border border-gray-200 rounded-lg p-4 bg-gray-50">
                    <h3 class="text-sm font-medium text-gray-700 mb-3">按名单选择人员</h3>
                    <div class="flex flex-col md:flex-row gap-3">
                        <div class="flex-grow relative">
                            <input type="text" id="list-file-path" class="w-full px-4 py-2 border border-gray-300 rounded-md focus:outline-none focus:ring-2 focus:ring-primary/50 focus:border-primary" placeholder="名单文件路径">
                            <button id="select-list-file" class="absolute right-2 top-1/2 transform -translate-y-1/2 bg-primary text-white px-3 py-1 rounded text-sm hover:bg-primary/90 transition-colors">
                                选择名单文件
                            </button>
                        </div>
                        <button id="confirm-list-selection" class="bg-accent text-white px-5 py-2 rounded-md hover:bg-accent/90 transition-colors whitespace-nowrap">
                            确认选择
                        </button>
                    </div>
                    <div class="mt-3 text-sm text-blue-600" id="selected-count">未选择任何人员</div>
                </div>
            </div>

            <!-- 自定义生成简历框架 -->
            <div id="custom-generate-frame" class="mb-5 hidden">
                <div class="border border-gray-200 rounded-lg p-4 bg-gray-50">
                    <h3 class="text-sm font-medium text-gray-700 mb-3 flex justify-between items-center">
                        <span>点选人员名单</span>
                        <div class="flex gap-2">
                            <button id="toggle-person-list" class="text-sm text-secondary hover:text-primary">
                                <i class="fas fa-chevron-up"></i> 折叠
                            </button>
                        </div>
                    </h3>

                    <!-- 人员名单控制区 -->
                    <div class="flex flex-wrap gap-3 mb-3">
                        <button id="update-person-list" class="bg-white border border-gray-300 text-gray-700 px-3 py-1 rounded text-sm hover:bg-gray-50 transition-colors">
                            更新人员名单
                        </button>
                        <button id="load-last-selected" class="bg-white border border-gray-300 text-gray-700 px-3 py-1 rounded text-sm hover:bg-gray-50 transition-colors">
                            上次选择人员
                        </button>
                        <div class="relative ml-auto">
                            <input type="text" id="search-person" class="w-48 px-3 py-1 border border-gray-300 rounded-md text-sm focus:outline-none focus:ring-2 focus:ring-primary/50 focus:border-primary" placeholder="搜索">
                            <i class="fas fa-search absolute right-3 top-1/2 transform -translate-y-1/2 text-gray-400"></i>
                        </div>
                        <button id="confirm-selection" class="bg-accent text-white px-3 py-1 rounded text-sm hover:bg-accent/90 transition-colors">
                            确认选择
                        </button>
                        <button id="clear-selection" class="bg-white border border-gray-300 text-gray-700 px-3 py-1 rounded text-sm hover:bg-gray-50 transition-colors">
                            清除选择
                        </button>
                    </div>

                    <!-- 部门筛选 -->
                    <div class="flex flex-wrap gap-3 mb-3 p-2 bg-white rounded-md">
                        <label class="text-sm text-gray-700">一级部门:</label>
                        <select id="level1-dept" class="px-2 py-1 border border-gray-300 rounded-md text-sm focus:outline-none focus:ring-2 focus:ring-primary/50 focus:border-primary">
                            <option value="">全部</option>
                        </select>
                        <label class="text-sm text-gray-700 ml-3">二级部门:</label>
                        <select id="level2-dept" class="px-2 py-1 border border-gray-300 rounded-md text-sm focus:outline-none focus:ring-2 focus:ring-primary/50 focus:border-primary">
                            <option value="">全部</option>
                        </select>
                        <button id="filter-by-dept" class="bg-white border border-gray-300 text-gray-700 px-3 py-1 rounded text-sm hover:bg-gray-50 transition-colors ml-auto">
                            部门筛选
                        </button>
                        <button id="clear-filters" class="bg-white border border-gray-300 text-gray-700 px-3 py-1 rounded text-sm hover:bg-gray-50 transition-colors">
                            清除筛选
                        </button>
                    </div>

                    <!-- 人员列表 -->
                    <div class="overflow-auto max-h-64 border border-gray-200 rounded-md" id="person-list-container">
                        <table class="min-w-full divide-y divide-gray-200">
                            <thead class="bg-gray-50 sticky top-0">
                                <tr>
                                    <th class="px-4 py-2 text-left text-xs font-medium text-gray-500 uppercase tracking-wider w-16">选择</th>
                                    <th class="px-4 py-2 text-left text-xs font-medium text-gray-500 uppercase tracking-wider w-24">员工编号</th>
                                    <th class="px-4 py-2 text-left text-xs font-medium text-gray-500 uppercase tracking-wider w-36">人员姓名</th>
                                    <th class="px-4 py-2 text-left text-xs font-medium text-gray-500 uppercase tracking-wider">部门</th>
                                </tr>
                            </thead>
                            <tbody id="person-list-body" class="bg-white divide-y divide-gray-200">
                                <!-- 人员列表将通过JavaScript动态加载 -->
                                <tr>
                                    <td colspan="4" class="px-4 py-3 text-center text-gray-500">请先更新人员名单</td>
                                </tr>
                            </tbody>
                        </table>
                    </div>
                </div>
            </div>

            <!-- 银行选择和生成按钮 -->
            <div class="flex flex-col md:flex-row gap-4 items-start md:items-center">
                <div class="flex items-center gap-4">
                    <div id="bank-logo" class="w-20 h-20 border border-gray-200 rounded-md flex items-center justify-center bg-white">
                        <i class="fas fa-university text-gray-300 text-3xl"></i>
                    </div>
                    <div>
                        <label class="block text-sm font-medium text-gray-700 mb-1">银行:</label>
                        <select id="bank-select" class="w-48 px-3 py-2 border border-gray-300 rounded-md focus:outline-none focus:ring-2 focus:ring-primary/50 focus:border-primary">
                            <!-- 银行列表将通过JavaScript动态加载 -->
                        </select>
                    </div>
                </div>
                <button id="generate-resumes" class="bg-accent text-white px-6 py-2 rounded-md hover:bg-accent/90 transition-colors whitespace-nowrap mt-4 md:mt-0">
                    <i class="fas fa-file-export mr-1"></i>生成简历
                </button>
            </div>
        </section>

        <!-- 进度条 -->
        <section class="bg-white rounded-lg shadow-sm p-5 mb-6">
            <div class="mb-2">
                <div class="w-full bg-gray-200 rounded-full h-2.5">
                    <div id="progress-bar" class="bg-accent h-2.5 rounded-full" style="width: 0%"></div>
                </div>
            </div>
            <div class="text-right text-sm text-gray-500" id="progress-text">0%</div>
        </section>

        <!-- 日志显示区域 -->
        <section class="bg-white rounded-lg shadow-sm p-5 mb-6">
            <h2 class="text-lg font-semibold mb-4 flex items-center">
                <i class="fas fa-history text-primary mr-2"></i>日志信息
            </h2>
            <div class="border border-gray-200 rounded-md h-64 overflow-auto bg-gray-50 p-3" id="log-container">
                <pre id="log-content" class="text-sm text-gray-700 whitespace-pre-wrap font-mono">[系统] 简历生成器已启动</pre>
            </div>
        </section>
    </main>

    <!-- 页脚 -->
    <footer class="bg-white border-t border-gray-200 py-4">
        <div class="container mx-auto px-4 text-center text-sm text-gray-500">
            <p>© 2024 长亮科技简历生成器 - 技术支持</p>
        </div>
    </footer>

    <!-- 特殊更新对话框 -->
    <div id="special-update-dialog" class="fixed inset-0 bg-black bg-opacity-50 z-50 hidden flex items-center justify-center">
        <div class="bg-white rounded-lg shadow-xl w-full max-w-3xl max-h-[90vh] overflow-auto">
            <div class="p-5 border-b border-gray-200">
                <h3 class="text-xl font-semibold text-gray-900">特殊更新</h3>
            </div>
            <div class="p-5">
                <div class="mb-4">
                    <label class="block text-sm font-medium text-gray-700 mb-1">简历文件夹:</label>
                    <div class="flex gap-2">
                        <input type="text" id="special-resume-folder" class="flex-grow px-4 py-2 border border-gray-300 rounded-md focus:outline-none focus:ring-2 focus:ring-primary/50 focus:border-primary" placeholder="请选择简历文件夹">
                        <button id="select-special-resume-folder" class="bg-primary text-white px-3 py-2 rounded-md hover:bg-primary/90 transition-colors whitespace-nowrap">
                            浏览
                        </button>
                    </div>
                </div>
                <div class="mb-4">
                    <label class="block text-sm font-medium text-gray-700 mb-1">人员信息文件:</label>
                    <div class="flex gap-2">
                        <input type="text" id="special-info-file" class="flex-grow px-4 py-2 border border-gray-300 rounded-md focus:outline-none focus:ring-2 focus:ring-primary/50 focus:border-primary" placeholder="请选择Excel文件">
                        <button id="select-special-info-file" class="bg-primary text-white px-3 py-2 rounded-md hover:bg-primary/90 transition-colors whitespace-nowrap">
                            浏览
                        </button>
                    </div>
                </div>
                <div class="mb-4">
                    <div class="flex items-center gap-2">
                        <input type="checkbox" id="special-force-update" class="rounded text-primary focus:ring-primary">
                        <label for="special-force-update" class="text-sm text-gray-700">强制更新所有信息</label>
                    </div>
                </div>
                <div class="mb-4">
                    <button id="execute-special-update" class="bg-accent text-white px-5 py-2 rounded-md hover:bg-accent/90 transition-colors">
                        开始更新
                    </button>
                </div>
                <div class="border border-gray-200 rounded-md h-40 overflow-auto bg-gray-50 p-3">
                    <pre id="special-update-log" class="text-sm text-gray-700 whitespace-pre-wrap font-mono">[系统] 准备就绪</pre>
                </div>
            </div>
            <div class="p-5 border-t border-gray-200 flex justify-end">
                <button id="close-special-update" class="bg-gray-200 text-gray-700 px-4 py-2 rounded-md hover:bg-gray-300 transition-colors">
                    关闭
                </button>
            </div>
        </div>
    </div>

    <!-- 预处理对话框 -->
    <div id="preprocess-dialog" class="fixed inset-0 bg-black bg-opacity-50 z-50 hidden flex items-center justify-center">
        <div class="bg-white rounded-lg shadow-xl w-full max-w-3xl max-h-[90vh] overflow-auto">
            <div class="p-5 border-b border-gray-200">
                <h3 class="text-xl font-semibold text-gray-900">预处理</h3>
            </div>
            <div class="p-5">
                <div class="mb-4">
                    <label class="block text-sm font-medium text-gray-700 mb-1">简历文件夹:</label>
                    <div class="flex gap-2">
                        <input type="text" id="preprocess-folder" class="flex-grow px-4 py-2 border border-gray-300 rounded-md focus:outline-none focus:ring-2 focus:ring-primary/50 focus:border-primary" placeholder="请选择简历文件夹">
                        <button id="select-preprocess-folder" class="bg-primary text-white px-3 py-2 rounded-md hover:bg-primary/90 transition-colors whitespace-nowrap">
                            浏览
                        </button>
                    </div>
                </div>
                <div class="mb-4">
                    <button id="execute-preprocess" class="bg-accent text-white px-5 py-2 rounded-md hover:bg-accent/90 transition-colors">
                        开始预处理
                    </button>
                </div>
                <div class="border border-gray-200 rounded-md h-40 overflow-auto bg-gray-50 p-3">
                    <pre id="preprocess-log" class="text-sm text-gray-700 whitespace-pre-wrap font-mono">[系统] 准备就绪</pre>
                </div>
            </div>
            <div class="p-5 border-t border-gray-200 flex justify-end">
                <button id="close-preprocess" class="bg-gray-200 text-gray-700 px-4 py-2 rounded-md hover:bg-gray-300 transition-colors">
                    关闭
                </button>
            </div>
        </div>
    </div>

    <!-- 简历校验对话框 -->
    <div id="validation-dialog" class="fixed inset-0 bg-black bg-opacity-50 z-50 hidden flex items-center justify-center">
        <div class="bg-white rounded-lg shadow-xl w-full max-w-3xl max-h-[90vh] overflow-auto">
            <div class="p-5 border-b border-gray-200">
                <h3 class="text-xl font-semibold text-gray-900">简历校验</h3>
            </div>
            <div class="p-5">
                <div class="mb-4">
                    <label class="block text-sm font-medium text-gray-700 mb-1">简历文件夹:</label>
                    <div class="flex gap-2">
                        <input type="text" id="validation-folder" class="flex-grow px-4 py-2 border border-gray-300 rounded-md focus:outline-none focus:ring-2 focus:ring-primary/50 focus:border-primary" placeholder="请选择简历文件夹">
                        <button id="select-validation-folder" class="bg-primary text-white px-3 py-2 rounded-md hover:bg-primary/90 transition-colors whitespace-nowrap">
                            浏览
                        </button>
                    </div>
                </div>
                <div class="mb-4">
                    <button id="execute-validation" class="bg-accent text-white px-5 py-2 rounded-md hover:bg-accent/90 transition-colors">
                        开始校验
                    </button>
                </div>
                <div class="border border-gray-200 rounded-md h-40 overflow-auto bg-gray-50 p-3">
                    <pre id="validation-log" class="text-sm text-gray-700 whitespace-pre-wrap font-mono">[系统] 准备就绪</pre>
                </div>
            </div>
            <div class="p-5 border-t border-gray-200 flex justify-end">
                <button id="close-validation" class="bg-gray-200 text-gray-700 px-4 py-2 rounded-md hover:bg-gray-300 transition-colors">
                    关闭
                </button>
            </div>
        </div>
    </div>

    <!-- JavaScript -->
    <script src="static/js/main.js"></script>
</body>
</html>
