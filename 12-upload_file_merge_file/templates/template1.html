<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Python Script Runner</title>
    <style>
        /* 全局字体与布局设置 */
        body {
            font-family: 'Microsoft YaHei', sans-serif;
            background-color: #f4f6f9;
            color: #333;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            margin: 0;
        }

        /* 主容器样式 */
        .main-container {
            width: 650px;
            height: 400px;
            background: #fff;
            box-shadow: 0 4px 8px rgba(0, 0, 0, 0.1);
            border-radius: 8px;
            padding: 20px;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            align-items: center;
        }

        /* 左右文件上传容器 */
        .upload-container {
            display: flex;
            justify-content: space-between;
            width: 100%;
        }

        /* 单个上传文件的区域 */
        .file-box {
            width: 48%;
            padding: 15px;
            background: #f9f9f9;
            border: 1px solid #ddd;
            border-radius: 8px;
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 10px;
        }

        /* 文件选择状态样式 */
        .file-status {
            font-weight: bold;
            color: red;
        }

        /* 按钮样式 */
        button {
            padding: 8px 16px;
            border: none;
            border-radius: 4px;
            cursor: pointer;
            font-size: 14px;
        }

        button.upload-btn {
            background-color: #007bff;
            color: white;
        }

        button.upload-btn:hover {
            background-color: #0056b3;
        }

        /* 底部按钮区域 */
        .action-buttons {
            width: 100%;
            display: flex;
            justify-content: center;
            gap: 10px;
        }

        /* 进度条样式 */
        .progress-bar {
            width: 80%;
            height: 8px;
            background-color: #ddd;
            border-radius: 4px;
            margin-top: 20px;
        }

        .progress-fill {
            height: 100%;
            width: 0;
            background-color: #007bff;
            border-radius: 4px;
            transition: width 0.3s;
        }

        #popup {
            display: none;
            position: fixed;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%) scale(0.9);
            width: 300px;
            background: white;
            padding: 20px;
            box-shadow: 0px 4px 15px rgba(0, 0, 0, 0.2);
            z-index: 11;
            opacity: 0;
            transition: opacity 0.3s ease-in-out, transform 0.3s ease-in-out;
        }

        #overlay {
            display: none;
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0, 0, 0, 0.5);
            z-index: 10;
            opacity: 0;
            transition: opacity 0.3s ease-in-out;
        }

        /* 显示时的类 */
        .show {
            display: block;
            opacity: 1; /* 完全不透明 */
        }

        /* 弹出动画 */
        .popup-animate-in {
            transform: translate(-50%, -50%) scale(1); /* 弹出时恢复原始大小 */
        }

        /* 添加动画效果 */
        #popup.show {
            opacity: 1; /* 显示弹出窗口 */
            transform: translate(-50%, -50%) scale(1); /* 放大到正常大小 */
        }

        #overlay.show {
            opacity: 1; /* 显示遮罩层 */
        }
    </style>
</head>
<body>
    <div class="main-container">
        <div class="upload-container">
            <!-- TXT 上传容器 -->
            <div class="file-box" id="txtBox">
                <p class="file-status" id="txtStatus">No file selected</p>
                <input type="file" id="txtFileInput" accept=".txt">
                <button class="upload-btn" onclick="uploadFile('txt')">Upload TXT</button>
                <button onclick="analyzeTxt()">Analyze TXT</button>
            </div>

            <!-- XLSX 上传容器 -->
            <div class="file-box" id="xlsxBox">
                <p class="file-status" id="xlsxStatus">No file selected</p>
                <input type="file" id="xlsxFileInput" accept=".xlsx">
                <button class="upload-btn" onclick="uploadFile('xlsx')">Upload XLSX</button>
            </div>
        </div>

        <!-- 进度条 -->
        <div class="progress-bar">
            <div class="progress-fill" id="progressFill"></div>
        </div>

        <!-- 底部按钮 -->
        <div class="action-buttons">
            <button onclick="runScript()">Run Script</button>
            <button onclick="downloadFile()">Download Result</button>
            <button onclick="clearFiles()">Clear Files</button>
        </div>
    </div>

    <!-- 弹出窗口 -->
    <div id="overlay" onclick="closePopup()"></div>
    <div id="popup">
        <h3>TXT File Content</h3>
        <div id="popupContent"></div>
        <button onclick="closePopup()">Close</button>
    </div>

    <script>
        let txtFilename = '';
        let xlsxFilename = '';
        let txtContent = [];  // 保存 TXT 内容

        function analyzeTxt() {
            if (txtContent.length === 0) {
                alert("Please upload a TXT file first.");
                return;
            }
                const popupContent = document.getElementById('popupContent');
                popupContent.innerHTML = txtContent.join('<br>');  // 将 TXT 文件内容插入弹窗内容区域
                console.log("Opening popup with content:", txtContent);  // 调试输出内容
                openPopup();  // 调用显示弹窗
            }
                function analyzeTxt() {
            if (txtContent.length === 0) {
                alert("Please upload a TXT file first.");
                return;
            }

            const popupContent = document.getElementById('popupContent');
            popupContent.innerHTML = txtContent.join('<br>');  // 将 TXT 文件内容插入弹窗内容区域
            console.log("Opening popup with content:", txtContent);  // 调试输出内容

            openPopup();  // 调用显示弹窗
        }

        function openPopup() {
            const overlay = document.getElementById('overlay');
            const popup = document.getElementById('popup');
            
            // 显示遮罩和弹窗
            overlay.classList.add('show');
            popup.classList.add('show', 'popup-animate-in');
            
            console.log("Popup should now be visible");  // 调试输出
        }

        function uploadFile(type) {
            const fileInput = document.getElementById(type === 'txt' ? 'txtFileInput' : 'xlsxFileInput');
            const fileStatus = document.getElementById(type === 'txt' ? 'txtStatus' : 'xlsxStatus');
            const file = fileInput.files[0];
            if (!file) {
                alert("Please select a file");
                return;
            }

            const formData = new FormData();
            formData.append('file', file);

            fetch('/upload', {
                method: 'POST',
                body: formData
            })
            .then(response => response.json())
            .then(data => {
                if (data.status === 'success') {
                    if (type === 'txt') {
                        txtFilename = data.filename;
                        txtContent = data.content;  // 保存返回的文件内容
                        fileStatus.style.color = "green";
                        fileStatus.textContent = "TXT file uploaded successfully";
                        console.log("TXT content loaded:", txtContent);  // 确认内容加载
                    }
                    if (type === 'xlsx') {
                        xlsxFilename = data.filename;
                        fileStatus.style.color = "green";
                        fileStatus.textContent = "XLSX file uploaded successfully";
                    }
                } else {
                    alert(data.message);
                }
            });
        }



        function runScript() {
            if (!txtFilename || !xlsxFilename) {
                alert("Please upload both the TXT and XLSX files.");
                return;
            }

            fetch('/run', {
                method: 'POST',
                headers: {
                    'Content-Type': 'application/json'
                },
                body: JSON.stringify({ txt_filename: txtFilename, xlsx_filename: xlsxFilename })
            })
            .then(response => response.json())
            .then(data => {
                if (data.status === 'success') {
                    animateProgress();
                } else {
                    alert(data.message);
                }
            });
        }

        function animateProgress() {
            const progressFill = document.getElementById('progressFill');
            let width = 0;
            const interval = setInterval(() => {
                if (width >= 100) {
                    clearInterval(interval);
                    alert("Processing complete. You can download the file now.");
                } else {
                    width += 1;
                    progressFill.style.width = width + "%";
                }
            }, 50);
        }

        function downloadFile() {
            window.location.href = '/download';
        }

        function clearFiles() {
            txtFilename = '';
            xlsxFilename = '';
            txtContent = [];
            document.getElementById('txtFileInput').value = '';
            document.getElementById('xlsxFileInput').value = '';
            document.getElementById('txtStatus').textContent = 'No file selected';
            document.getElementById('txtStatus').style.color = 'red';
            document.getElementById('xlsxStatus').textContent = 'No file selected';
            document.getElementById('xlsxStatus').style.color = 'red';
            document.getElementById('progressFill').style.width = "0%";
            alert("Files cleared successfully.");
        }
    </script>
</body>
</html>
