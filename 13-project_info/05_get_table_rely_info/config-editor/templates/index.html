<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SQL依赖关系分析工具 - 配置编辑器</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://cdn.jsdelivr.net/npm/font-awesome@4.7.0/css/font-awesome.min.css" rel="stylesheet">
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        primary: '#3b82f6',
                        secondary: '#6b7280',
                    },
                }
            }
        }
    </script>
    <style type="text/tailwindcss">
        @layer utilities {
            .content-auto {
                content-visibility: auto;
            }
            .tab-content {
                display: none;
            }
            .tab-content.active {
                display: block;
            }
        }
        body {
            font-family: 'Microsoft YaHei', Arial, sans-serif;
        }
        table th {
            position: sticky;
            top: 0;
            z-index: 10;
        }
    </style>
</head>
<body class="bg-gradient-to-br from-blue-50 to-indigo-100 min-h-screen">
    <div class="container mx-auto px-4 py-8">
        <!-- 标题 -->
        <div class="mb-8 text-center">
            <div class="bg-white rounded-2xl shadow-lg p-8">
                <h1 class="text-3xl font-bold text-gray-800 mb-2">⚙️ SQL依赖关系分析工具</h1>
                <p class="text-lg text-gray-600">配置编辑器</p>
            </div>
        </div>

        <!-- 控制按钮 -->
        <div class="flex flex-wrap justify-center gap-4 mb-6">
            <button id="save-btn" class="bg-gradient-to-r from-blue-500 to-blue-700 hover:from-blue-600 hover:to-blue-800 text-white px-6 py-3 rounded-lg shadow-md flex items-center gap-2 transition-all duration-300 hover:shadow-lg font-medium">
                <i class="fa fa-save"></i> 保存配置
            </button>
            <button id="load-btn" class="bg-gradient-to-r from-green-500 to-green-700 hover:from-green-600 hover:to-green-800 text-white px-6 py-3 rounded-lg shadow-md flex items-center gap-2 transition-all duration-300 hover:shadow-lg font-medium">
                <i class="fa fa-upload"></i> 上传配置
            </button>
            <a href="/api/config/download" class="bg-gradient-to-r from-purple-500 to-purple-700 hover:from-purple-600 hover:to-purple-800 text-white px-6 py-3 rounded-lg shadow-md flex items-center gap-2 transition-all duration-300 hover:shadow-lg font-medium">
                <i class="fa fa-download"></i> 下载配置
            </a>
            <input type="file" id="config-file" accept=".yaml" class="hidden">
        </div>

        <!-- 消息提示 -->
        <div id="message" class="mb-6 p-4 rounded-lg shadow-md hidden max-w-3xl mx-auto"></div>

        <!-- 标签页导航 -->
        <div class="bg-white rounded-2xl shadow-md mb-6 overflow-hidden">
            <nav class="flex overflow-x-auto justify-center space-x-8 bg-gradient-to-r from-blue-500 to-blue-700 p-2 rounded-lg shadow-md" aria-label="Tabs">
                <button data-tab="processing" class="tab-btn whitespace-nowrap py-4 px-6 border-b-2 border-white font-bold text-sm text-white hover:bg-blue-600 transition-colors duration-150">
                    处理配置
                </button>
                <button data-tab="projects" class="tab-btn whitespace-nowrap py-4 px-6 border-b-2 border-transparent font-bold text-sm text-white/80 hover:text-white hover:border-white hover:bg-blue-600 transition-colors duration-150">
                    项目配置
                </button>
                <button data-tab="templates" class="tab-btn whitespace-nowrap py-4 px-6 border-b-2 border-transparent font-bold text-sm text-white/80 hover:text-white hover:border-white hover:bg-blue-600 transition-colors duration-150">
                    文件模板
                </button>
                <button data-tab="regex" class="tab-btn whitespace-nowrap py-4 px-6 border-b-2 border-transparent font-bold text-sm text-white/80 hover:text-white hover:border-white hover:bg-blue-600 transition-colors duration-150">
                    正则表达式
                </button>
                <button data-tab="filters" class="tab-btn whitespace-nowrap py-4 px-6 border-b-2 border-transparent font-bold text-sm text-white/80 hover:text-white hover:border-white hover:bg-blue-600 transition-colors duration-150">
                    过滤规则
                </button>
                <button data-tab="output" class="tab-btn whitespace-nowrap py-4 px-6 border-b-2 border-transparent font-bold text-sm text-white/80 hover:text-white hover:border-white hover:bg-blue-600 transition-colors duration-150">
                    输出配置
                </button>
                <button data-tab="progress" class="tab-btn whitespace-nowrap py-4 px-6 border-b-2 border-transparent font-bold text-sm text-white/80 hover:text-white hover:border-white hover:bg-blue-600 transition-colors duration-150">
                    进度条配置
                </button>
            </nav>
        </div>

        <!-- 标签页内容 -->
        <div class="bg-white rounded-2xl shadow-lg p-8">
            <!-- 处理配置 -->
            <div id="processing" class="tab-content active">
                <h2 class="text-xl font-semibold text-gray-800 mb-6">SQL文件处理配置</h2>
                <div class="grid grid-cols-1 md:grid-cols-2 gap-6">
                    <div>
                        <label class="block text-xs font-medium text-gray-700 mb-1">是否去除后缀</label>
                        <select id="remove_suffix" class="w-full px-3 py-2 border border-gray-300 rounded-lg focus:outline-none focus:ring-2 focus:ring-primary transition-all duration-300 text-xs">
                            <option value="Y" class="text-xs">是</option>
                            <option value="N" class="text-xs">否</option>
                        </select>
                    </div>
                    <div>
                        <label class="block text-xs font-medium text-gray-700 mb-1">后缀标识符</label>
                        <input type="text" id="suffix_identifier" class="w-full px-3 py-2 border border-gray-300 rounded-lg focus:outline-none focus:ring-2 focus:ring-primary transition-all duration-300 text-xs">
                    </div>
                    <div>
                        <label class="block text-xs font-medium text-gray-700 mb-1">筛选模式</label>
                        <input type="text" id="filter_schema" class="w-full px-3 py-2 border border-gray-300 rounded-lg focus:outline-none focus:ring-2 focus:ring-primary transition-all duration-300 text-xs">
                    </div>
                </div>
            </div>

            <!-- 项目配置 -->
            <div id="projects" class="tab-content">
                <h2 class="text-xl font-semibold text-gray-800 mb-6">项目配置</h2>
                <div class="mb-4">
                    <button id="add-project" class="bg-primary hover:bg-primary/90 text-white px-6 py-3 rounded-lg shadow-md flex items-center gap-2 transition-all duration-300 hover:shadow-lg">
                        <i class="fa fa-plus"></i> 添加项目
                    </button>
                </div>
                <div class="overflow-x-auto rounded-lg border border-gray-200">
                    <table id="projects-table" class="min-w-full divide-y divide-gray-200">
                        <thead class="bg-gray-50">
                            <tr>
                                <th class="px-6 py-4 text-left text-xs font-semibold text-gray-700 uppercase tracking-wider sticky top-0 bg-gray-50">项目名称</th>
                                <th class="px-6 py-4 text-left text-xs font-semibold text-gray-700 uppercase tracking-wider sticky top-0 bg-gray-50">前缀</th>
                                <th class="px-6 py-4 text-left text-xs font-semibold text-gray-700 uppercase tracking-wider sticky top-0 bg-gray-50">主题</th>
                                <th class="px-6 py-4 text-left text-xs font-semibold text-gray-700 uppercase tracking-wider sticky top-0 bg-gray-50">描述</th>
                                <th class="px-6 py-4 text-left text-xs font-semibold text-gray-700 uppercase tracking-wider sticky top-0 bg-gray-50">操作</th>
                            </tr>
                        </thead>
                        <tbody id="projects-body" class="bg-white divide-y divide-gray-200">
                            <!-- 项目数据将通过 JavaScript 动态生成 -->
                        </tbody>
                    </table>
                </div>
            </div>

            <!-- 文件模板 -->
            <div id="templates" class="tab-content">
                <h2 class="text-xl font-semibold text-gray-800 mb-6">文件模板配置</h2>
                <div id="templates-container" class="space-y-8">
                    <!-- 模板数据将通过 JavaScript 动态生成 -->
                </div>
            </div>

            <!-- 正则表达式 -->
            <div id="regex" class="tab-content">
                <h2 class="text-xl font-semibold text-gray-800 mb-6">正则表达式配置</h2>
                
                <!-- 表引用正则 -->
                <div class="mb-8 p-6 bg-blue-50 rounded-xl border border-blue-200">
                    <h3 class="text-lg font-medium mb-3 text-blue-700">表引用正则表达式</h3>
                    <div id="ref-patterns" class="space-y-3">
                        <!-- 引用模式将通过 JavaScript 动态生成 -->
                    </div>
                    <div class="mt-4">
                        <button id="add-ref-pattern" class="bg-primary hover:bg-primary/90 text-white px-4 py-2 rounded-lg shadow-sm text-xs flex items-center gap-2 transition-all duration-300 hover:shadow">
                            <i class="fa fa-plus"></i> 添加模式
                        </button>
                        <button id="remove-ref-pattern" class="bg-red-500 hover:bg-red-600 text-white px-4 py-2 rounded-lg shadow-sm text-xs flex items-center gap-2 ml-2 transition-all duration-300 hover:shadow">
                            <i class="fa fa-trash"></i> 删除最后一条
                        </button>
                    </div>
                </div>

                <!-- 表名清理模式 -->
                <div class="mb-8 p-6 bg-green-50 rounded-xl border border-green-200">
                    <h3 class="text-lg font-medium mb-3 text-green-700">表名清理模式</h3>
                    <div id="cleanup-patterns" class="space-y-3">
                        <!-- 清理模式将通过 JavaScript 动态生成 -->
                    </div>
                    <div class="mt-4">
                        <button id="add-cleanup-pattern" class="bg-primary hover:bg-primary/90 text-white px-4 py-2 rounded-lg shadow-sm text-xs flex items-center gap-2 transition-all duration-300 hover:shadow">
                            <i class="fa fa-plus"></i> 添加清理模式
                        </button>
                        <button id="remove-cleanup-pattern" class="bg-red-500 hover:bg-red-600 text-white px-4 py-2 rounded-lg shadow-sm text-xs flex items-center gap-2 ml-2 transition-all duration-300 hover:shadow">
                            <i class="fa fa-trash"></i> 删除最后一条
                        </button>
                    </div>
                </div>

                <!-- 文件扩展名 -->
                <div class="p-6 bg-purple-50 rounded-xl border border-purple-200">
                    <h3 class="text-lg font-medium mb-3 text-purple-700">文件扩展名</h3>
                    <div class="flex flex-col md:flex-row items-start md:items-center gap-3">
                        <label class="block text-xs font-medium text-gray-700 w-full md:w-40">SQL文件扩展名正则:</label>
                        <input type="text" id="file_extension" class="flex-1 w-full px-3 py-2 border border-gray-300 rounded-lg focus:outline-none focus:ring-2 focus:ring-primary transition-all duration-300 text-xs">
                    </div>
                </div>
            </div>

            <!-- 过滤规则 -->
            <div id="filters" class="tab-content">
                <h2 class="text-xl font-semibold text-gray-800 mb-6">过滤规则配置</h2>
                
                <!-- 基础过滤选项 -->
                <div class="mb-8 p-6 bg-blue-50 rounded-xl border border-blue-200">
                    <h3 class="text-lg font-medium mb-3 text-blue-700">基础过滤选项</h3>
                    <div class="space-y-4">
                        <div class="flex items-center gap-3">
                            <input type="checkbox" id="exclude_self_reference" class="w-4 h-4 text-primary rounded focus:ring-primary">
                            <label for="exclude_self_reference" class="text-xs font-medium text-gray-700">排除自引用</label>
                        </div>
                        <div class="flex items-center gap-3">
                            <input type="checkbox" id="exclude_same_layer" class="w-4 h-4 text-primary rounded focus:ring-primary">
                            <label for="exclude_same_layer" class="text-xs font-medium text-gray-700">排除同层依赖</label>
                        </div>
                    </div>
                </div>

                <!-- 排除模式 -->
                <div class="mb-8 p-6 bg-red-50 rounded-xl border border-red-200">
                    <h3 class="text-lg font-medium mb-3 text-red-700">排除模式（正则表达式）</h3>
                    <div id="exclude-patterns" class="space-y-3">
                        <!-- 排除模式将通过 JavaScript 动态生成 -->
                    </div>
                    <div class="mt-4">
                        <button id="add-exclude-pattern" class="bg-primary hover:bg-primary/90 text-white px-4 py-2 rounded-lg shadow-sm text-xs flex items-center gap-2 transition-all duration-300 hover:shadow">
                            <i class="fa fa-plus"></i> 添加排除模式
                        </button>
                        <button id="remove-exclude-pattern" class="bg-red-500 hover:bg-red-600 text-white px-4 py-2 rounded-lg shadow-sm text-xs flex items-center gap-2 ml-2 transition-all duration-300 hover:shadow">
                            <i class="fa fa-trash"></i> 删除最后一条
                        </button>
                    </div>
                </div>

                <!-- 包含模式 -->
                <div class="p-6 bg-green-50 rounded-xl border border-green-200">
                    <h3 class="text-lg font-medium mb-3 text-green-700">包含模式（正则表达式）</h3>
                    <div id="include-patterns" class="space-y-3">
                        <!-- 包含模式将通过 JavaScript 动态生成 -->
                    </div>
                    <div class="mt-4">
                        <button id="add-include-pattern" class="bg-primary hover:bg-primary/90 text-white px-4 py-2 rounded-lg shadow-sm text-xs flex items-center gap-2 transition-all duration-300 hover:shadow">
                            <i class="fa fa-plus"></i> 添加包含模式
                        </button>
                        <button id="remove-include-pattern" class="bg-red-500 hover:bg-red-600 text-white px-4 py-2 rounded-lg shadow-sm text-xs flex items-center gap-2 ml-2 transition-all duration-300 hover:shadow">
                            <i class="fa fa-trash"></i> 删除最后一条
                        </button>
                    </div>
                </div>
            </div>

            <!-- 输出配置 -->
            <div id="output" class="tab-content">
                <h2 class="text-xl font-semibold text-gray-800 mb-6">输出配置</h2>
                <div class="space-y-8">
                    <!-- 基础列 -->
                    <div>
                        <h3 class="text-lg font-medium mb-4 text-blue-700">基础列</h3>
                        <div id="basic-columns" class="overflow-x-auto rounded-lg border border-gray-200">
                            <table class="min-w-full divide-y divide-gray-200">
                                <thead class="bg-gray-50">
                                    <tr>
                                        <th class="px-6 py-4 text-left text-xs font-semibold text-gray-700 uppercase tracking-wider sticky top-0 bg-gray-50">列名</th>
                                        <th class="px-6 py-4 text-left text-xs font-semibold text-gray-700 uppercase tracking-wider sticky top-0 bg-gray-50">显示标题</th>
                                        <th class="px-6 py-4 text-left text-xs font-semibold text-gray-700 uppercase tracking-wider sticky top-0 bg-gray-50">宽度</th>
                                        <th class="px-6 py-4 text-left text-xs font-semibold text-gray-700 uppercase tracking-wider sticky top-0 bg-gray-50">隐藏</th>
                                    </tr>
                                </thead>
                                <tbody id="basic-columns-body" class="bg-white divide-y divide-gray-200">
                                    <!-- 基础列数据将通过 JavaScript 动态生成 -->
                                </tbody>
                            </table>
                        </div>
                    </div>

                    <!-- 扩展列 -->
                    <div>
                        <h3 class="text-lg font-medium mb-4 text-green-700">扩展列</h3>
                        <div id="extended-columns" class="overflow-x-auto rounded-lg border border-gray-200">
                            <table class="min-w-full divide-y divide-gray-200">
                                <thead class="bg-gray-50">
                                    <tr>
                                        <th class="px-6 py-4 text-left text-xs font-semibold text-gray-700 uppercase tracking-wider sticky top-0 bg-gray-50">列名</th>
                                        <th class="px-6 py-4 text-left text-xs font-semibold text-gray-700 uppercase tracking-wider sticky top-0 bg-gray-50">显示标题</th>
                                        <th class="px-6 py-4 text-left text-xs font-semibold text-gray-700 uppercase tracking-wider sticky top-0 bg-gray-50">宽度</th>
                                        <th class="px-6 py-4 text-left text-xs font-semibold text-gray-700 uppercase tracking-wider sticky top-0 bg-gray-50">隐藏</th>
                                    </tr>
                                </thead>
                                <tbody id="extended-columns-body" class="bg-white divide-y divide-gray-200">
                                    <!-- 扩展列数据将通过 JavaScript 动态生成 -->
                                </tbody>
                            </table>
                        </div>
                    </div>
                </div>
            </div>

            <!-- 进度条配置 -->
            <div id="progress" class="tab-content">
                <h2 class="text-xl font-semibold text-gray-800 mb-6">进度条显示配置</h2>
                <div class="grid grid-cols-1 md:grid-cols-2 gap-6">
                    <div>
                        <label class="block text-xs font-medium text-gray-700 mb-2">进度条长度</label>
                        <input type="number" id="bar_length" min="10" max="100" class="w-full px-3 py-2 border border-gray-300 rounded-lg focus:outline-none focus:ring-2 focus:ring-primary transition-all duration-300 text-xs">
                    </div>
                    <div class="flex flex-col items-start gap-3">
                        <div class="flex items-center gap-3">
                            <input type="checkbox" id="show_percentage" class="w-4 h-4 text-primary rounded focus:ring-primary">
                            <label for="show_percentage" class="block text-xs font-medium text-gray-700">显示百分比</label>
                        </div>
                    </div>
                    <div>
                        <label class="block text-xs font-medium text-gray-700 mb-2">更新频率</label>
                        <input type="number" id="update_frequency" min="1" max="100" class="w-full px-3 py-2 border border-gray-300 rounded-lg focus:outline-none focus:ring-2 focus:ring-primary transition-all duration-300 text-xs">
                    </div>
                </div>
            </div>
        </div>
    </div>

    <!-- 项目编辑模态框 -->
    <div id="project-modal" class="fixed inset-0 bg-black bg-opacity-50 flex items-center justify-center z-50 hidden">
        <div class="bg-white rounded-2xl shadow-xl p-8 w-full max-w-md transform transition-all duration-300 scale-100">
            <h3 id="modal-title" class="text-xl font-semibold text-gray-800 mb-6">添加项目</h3>
            <form id="project-form">
                <div class="mb-5">
                    <label for="modal-name" class="block text-xs font-medium text-gray-700 mb-2">项目名称</label>
                    <input type="text" id="modal-name" name="name" class="w-full px-3 py-2 border border-gray-300 rounded-lg focus:outline-none focus:ring-2 focus:ring-primary transition-all duration-300 text-xs" required>
                </div>
                <div class="mb-5">
                    <label for="modal-prefix" class="block text-xs font-medium text-gray-700 mb-2">前缀</label>
                    <input type="text" id="modal-prefix" name="prefix" class="w-full px-3 py-2 border border-gray-300 rounded-lg focus:outline-none focus:ring-2 focus:ring-primary transition-all duration-300 text-xs">
                </div>
                <div class="mb-5">
                    <label for="modal-theme" class="block text-xs font-medium text-gray-700 mb-2">主题</label>
                    <input type="text" id="modal-theme" name="theme" class="w-full px-3 py-2 border border-gray-300 rounded-lg focus:outline-none focus:ring-2 focus:ring-primary transition-all duration-300 text-xs">
                </div>
                <div class="mb-7">
                    <label for="modal-description" class="block text-xs font-medium text-gray-700 mb-2">描述</label>
                    <textarea id="modal-description" name="description" rows="4" class="w-full px-3 py-2 border border-gray-300 rounded-lg focus:outline-none focus:ring-2 focus:ring-primary transition-all duration-300 text-xs"></textarea>
                </div>
                <div class="flex justify-end gap-3">
                    <button type="button" id="cancel-modal" class="px-6 py-3 border border-gray-300 rounded-lg text-gray-700 hover:bg-gray-50 transition-all duration-300">取消</button>
                    <button type="submit" class="px-6 py-3 bg-primary text-white rounded-lg hover:bg-primary/90 transition-all duration-300 shadow-md hover:shadow-lg">保存</button>
                </div>
            </form>
        </div>
    </div>

    <script src="{{ url_for('static', filename='js/app.js') }}"></script>
</body>
</html>
