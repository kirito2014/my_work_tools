file_templates:
  default:
    delimiter: ':'
    file_pattern: .*\.(hql|sql)$
    lines:
      developer: 14
      table_name: 8
    name: 默认模板
  ta_pc:
    delimiter: ：
    file_pattern: .*ta_pc\.hql$
    lines:
      developer: 14
      table_name: 8
    name: TA明细表模板
  tf_pc:
    delimiter: ：
    file_pattern: .*tf_pc\.hql$
    lines:
      developer: 14
      table_name: 8
    name: TF事实表模板
  tg_pc:
    delimiter: ：
    file_pattern: .*tg_pc\.hql$
    lines:
      developer: 16
      table_name: 10
    name: TG聚合表模板
filters:
  exclude_patterns:
  - ^TMP_
  - ^BAK_
  - ^TEST_
  exclude_same_layer: true
  exclude_self_reference: true
  include_patterns: []
output:
  basic_columns:
  - hidden: false
    name: theme
    title: 主题领域
    width: 12
  - hidden: false
    name: target_table
    title: 目标表名
    width: 35
  - hidden: false
    name: table_cn_name
    title: 中文表名
    width: 30
  - hidden: false
    name: developer
    title: 开发人员
    width: 12
  - hidden: false
    name: source_table
    title: 来源表名
    width: 35
  - hidden: false
    name: source_schema
    title: 来源库名
    width: 15
  - hidden: false
    name: source_table_clean
    title: 清理后表名
    width: 35
  - hidden: true
    name: file_name
    title: 文件名
    width: 30
  extended_columns:
  - hidden: false
    name: etl_job_no
    title: 作业编号
    width: 15
  - hidden: false
    name: etl_job_name
    title: 作业名称
    width: 25
  - hidden: false
    name: dependency_level
    title: 依赖层级
    width: 10
processing:
  filter_schema: AGL
  remove_suffix: Y
  suffix_identifier: _PC
progress:
  bar_length: 30
  show_percentage: true
  update_frequency: 1
projects:
  AGL:
    description: 聚合层
    prefix: AGL_
    theme: AGL
  DIM:
    description: 维度层
    prefix: DIM_
    theme: DIM
  DWD:
    description: 数据仓库明细层
    prefix: DWD_
    theme: DWD
  ODS:
    description: 操作数据层
    prefix: ODS_
    theme: ODS
regex_patterns:
  file_extension: \.(hql|sql)$
  table_cleanup:
  - _PC$
  - _TMP$
  - _BAK$
  table_reference:
  - (?:FROM|JOIN)\s+(\w+\.\w+)\s+
  - (?:INSERT\s+INTO|INSERT\s+OVERWRITE)\s+(\w+\.\w+)\b
  - (?:TABLE|INTO)\s+(\w+\.\w+)\b
  - CREATE\s+TABLE\s+(?:IF\s+NOT\s+EXISTS\s+)?(\w+\.\w+)\b
